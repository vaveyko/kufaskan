[project]
name = "kufar-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "lxml>=6.1.1",
    "requests>=2.34.2",
]
# Указываем pip, что проект собирается через setuptools
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Объясняем, что наш проект состоит из одного файла-модуля
[tool.setuptools]
py-modules = ["main"]